<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Kontroll</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="app.css" />
  <style>
    .presentationShell {
      position: relative;
      min-height: 520px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: var(--space-6);
      overflow: hidden;
    }

    .presentationMuted {
      color: var(--color-text-soft);
    }

    .presentationQuestion {
      font-size: clamp(1.4rem, 1.1rem + 1.5vw, 2.4rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--color-text);
      margin-bottom: var(--space-5);
      max-width: 900px;
    }

    .presentationMeta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: var(--space-5);
      color: var(--color-text-soft);
      font-size: 0.95rem;
    }

    .presentationMeta span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--color-surface-soft);
      border: 1px solid var(--color-border);
      border-radius: 999px;
      padding: 6px 10px;
    }

    .presentationPlaceholder {
      padding: var(--space-7) 0;
      font-size: 1.05rem;
      color: var(--color-text-soft);
    }

    .presentationFooter {
      margin-top: var(--space-5);
      color: var(--color-text-soft);
      font-size: 0.95rem;
    }

    .presentationQrDock {
      position: absolute;
      right: 16px;
      bottom: 16px;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.12);
      max-width: 180px;
      z-index: 10;
    }

    .presentationQrDock.hidden {
      display: none;
    }

    .presentationQrTitle {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .presentationQrText {
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.3;
    }

    .presentationQrCodeText {
      font-size: 13px;
      font-weight: 700;
      margin-top: 6px;
    }

    #presentationQrBox {
      width: 140px;
      min-height: 140px;
    }

    #presentationQrBox img,
    #presentationQrBox canvas {
      display: block;
      margin: 0 auto;
    }

    @media (max-width: 700px) {
      .presentationShell {
        padding: var(--space-4);
        min-height: 420px;
      }

      .presentationQrDock {
        right: 10px;
        bottom: 10px;
        padding: 8px;
        max-width: 150px;
      }

      #presentationQrBox {
        width: 120px;
        min-height: 120px;
      }

      .presentationQrTitle {
        font-size: 12px;
      }

      .presentationQrText,
      .presentationQrCodeText {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <h1>Kontrollpanel</h1>

  <div id="topActionsBox" class="mt20">
    <strong>Session</strong><br><br>
    <div class="btnRow">
      <button id="loginBtn">Logg inn med Google</button>
      <button id="startSessionBtn">Start ny session</button>
    </div>
  </div>

  <div id="statusBox" class="mt20" aria-live="polite"></div>
  <div id="errorBox" class="mt20"></div>

  <div id="sessionBox" class="mt20"></div>
  <div id="controlsBox" class="mt20"></div>

  <div id="presentationBox" class="mt20"></div>

  <details id="techDetails" class="mt20">
    <summary><strong>Vis teknisk info</strong></summary>
    <div id="leaseBox" class="mt20"></div>
    <div id="userBox" class="mt20"></div>
  </details>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <!-- Lite QR-bibliotek -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <script src="config.js"></script>
  <script src="app.js"></script>

  <script>
    const loginBtn = document.getElementById("loginBtn");
    const userBox = document.getElementById("userBox");
    const startSessionBtn = document.getElementById("startSessionBtn");
    const sessionBox = document.getElementById("sessionBox");
    const leaseBox = document.getElementById("leaseBox");
    const statusBox = document.getElementById("statusBox");
    const errorBox = document.getElementById("errorBox");
    const controlsBox = document.getElementById("controlsBox");
    const presentationBox = document.getElementById("presentationBox");

    let activeSessionId = null;
    let activeJoinCode = null;

    let unsubscribeState = null;
    let unsubscribeAgg = null;
    let leaseTicker = null;

    let lastState = null;
    let lastAgg = null;
    let currentAggRoundId = null;

    let presentationQrInstance = null;
    let lastPresentationQrUrl = null;

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function setError(msg) {
      if (!msg) {
        errorBox.innerHTML = "";
        return;
      }

      errorBox.innerHTML = `
        <strong>Feil</strong><br>
        <span class="mono">${escapeHtml(msg)}</span>
      `;
    }

    let statusTimer = null;
    function setStatus(msg, kind) {
      if (statusTimer) clearTimeout(statusTimer);

      if (!msg) {
        statusBox.innerHTML = "";
        return;
      }

      const label = kind === "err"
        ? "Status (feil)"
        : kind === "warn"
          ? "Status (obs)"
          : "Status";

      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const ss = String(now.getSeconds()).padStart(2, "0");

      statusBox.innerHTML = `
        <strong>${label}</strong><br>
        <span class="mono">${hh}:${mm}:${ss}</span><br>
        ${escapeHtml(msg)}
      `;

      statusTimer = setTimeout(() => {
        statusBox.innerHTML = "";
      }, 3500);
    }

    function renderUser(user) {
      if (!user) {
        userBox.innerHTML = `
          <strong>Innlogging</strong><br>
          Ingen bruker er logget inn.
        `;
        return;
      }

      userBox.innerHTML = `
        <strong>Innlogget som</strong><br>
        ${escapeHtml(user.displayName || "")}<br>
        ${escapeHtml(user.email || "")}<br><br>
        ownerId (user.uid): <span class="mono">${escapeHtml(user.uid)}</span><br>
        clientId (localStorage): <span class="mono">${escapeHtml(App.getClientId())}</span>
      `;
    }

    function toMillisMaybe(ts) {
      if (!ts) return null;
      if (typeof ts.toMillis === "function") return ts.toMillis();
      if (typeof ts.seconds === "number") return (ts.seconds * 1000) + Math.floor((ts.nanoseconds || 0) / 1e6);
      return null;
    }

    function formatLease(state) {
      if (!state) {
        return `
          <strong>Controller lease</strong><br>
          Ingen state/live lest ennå.
        `;
      }

      const cid = state.controllerId || "(ikke satt)";
      const untilMs = toMillisMaybe(state.controllerLeaseUntil);

      const nowMs = Date.now();
      const active = (untilMs !== null) ? (untilMs > nowMs) : false;
      const remaining = (untilMs !== null) ? Math.max(0, Math.round((untilMs - nowMs) / 1000)) : null;

      const mine = (cid === App.getClientId());

      return `
        <strong>Controller lease</strong><br>
        controllerId: <span class="mono">${escapeHtml(cid)}</span><br>
        status: ${active ? "aktiv" : "utløpt/ikke satt"}<br>
        gjenstår: ${remaining === null ? "-" : (remaining + " sek")}<br>
        min controller: ${mine ? "ja" : "nei"}
      `;
    }

    function renderLease(state) {
      leaseBox.innerHTML = formatLease(state);
    }

    function parseChoices(text) {
      const lines = String(text || "")
        .split("\n")
        .map(x => x.trim())
        .filter(Boolean);

      const choices = [];
      const seen = new Set();

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const parts = line.split("|").map(x => x.trim()).filter(Boolean);

        let id = "";
        let label = "";

        if (parts.length >= 2) {
          id = parts[0];
          label = parts.slice(1).join(" | ");
        } else {
          label = line;
          id = line;
        }

        if (!id || !label) throw new Error("Ugyldig choice på linje " + (i + 1) + ".");
        if (seen.has(id)) throw new Error("Duplisert choice-id: " + id);
        seen.add(id);

        choices.push({ id, label });
      }

      if (choices.length < 2) throw new Error("Multi krever minst 2 choices.");
      return choices;
    }

    function buildUrl(path, params) {
      const u = new URL(path, window.location.href);
      Object.entries(params || {}).forEach(([k, v]) => {
        if (v == null || v === "") return;
        u.searchParams.set(k, String(v));
      });
      return u.toString();
    }

    function openInNewTab(url) {
      window.open(url, "_blank", "noopener");
    }

    async function copyToClipboard(text) {
      const t = String(text || "");
      if (!t) throw new Error("Mangler joinCode å kopiere.");

      if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
        await navigator.clipboard.writeText(t);
        return;
      }

      const ta = document.createElement("textarea");
      ta.value = t;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }

    function buildParticipantUrl(code) {
      const u = new URL("innhenting.html", window.location.href);
      u.searchParams.set("joinCode", String(code).toUpperCase());
      return u.toString();
    }

    function clearPresentationQr() {
      const qrBox = document.getElementById("presentationQrBox");
      const qrCodeText = document.getElementById("presentationQrCodeText");
      const qrDock = document.getElementById("presentationQrDock");

      if (qrBox) qrBox.innerHTML = "";
      if (qrCodeText) qrCodeText.textContent = "";
      if (qrDock) qrDock.classList.add("hidden");

      presentationQrInstance = null;
      lastPresentationQrUrl = null;
    }

    function renderPresentationQr() {
      const qrBox = document.getElementById("presentationQrBox");
      const qrCodeText = document.getElementById("presentationQrCodeText");
      const qrDock = document.getElementById("presentationQrDock");

      if (!qrBox || !qrCodeText || !qrDock) return;

      if (!activeJoinCode || !/^[A-Z0-9]{6}$/.test(activeJoinCode)) {
        clearPresentationQr();
        return;
      }

      const participantUrl = buildParticipantUrl(activeJoinCode);

      if (participantUrl === lastPresentationQrUrl) {
        qrCodeText.textContent = activeJoinCode;
        qrDock.classList.remove("hidden");
        return;
      }

      qrBox.innerHTML = "";
      qrCodeText.textContent = activeJoinCode;
      qrDock.classList.remove("hidden");

      presentationQrInstance = new QRCode(qrBox, {
        text: participantUrl,
        width: 140,
        height: 140,
        correctLevel: QRCode.CorrectLevel.M
      });

      lastPresentationQrUrl = participantUrl;
    }

    function renderSessionBox() {
      if (!activeSessionId) {
        sessionBox.innerHTML = `
          <strong>Aktiv session</strong><br>
          Ingen aktiv session akkurat nå.
        `;
        return;
      }

      const displayUrl = activeJoinCode
        ? buildUrl("display.html", { joinCode: activeJoinCode })
        : null;

      const collectUrl = activeJoinCode
        ? buildUrl("innhenting.html", { joinCode: activeJoinCode })
        : null;

      const canOpen = !!activeJoinCode;

      sessionBox.innerHTML = `
        <strong>Aktiv session</strong><br>
        sessionId: <span class="mono">${escapeHtml(activeSessionId || "-")}</span><br>
        joinCode: <span class="mono">${escapeHtml(activeJoinCode || "-")}</span><br><br>

        <div class="btnRow">
          <button class="btn" id="openDisplayBtn" ${canOpen ? "" : "disabled"}>Åpne plenum</button>
          <button class="btn" id="openCollectBtn" ${canOpen ? "" : "disabled"}>Åpne deltakerlenke</button>
          <button class="btn" id="copyJoinCodeBtn" ${canOpen ? "" : "disabled"}>Kopier joincode</button>
        </div>

        <div class="mt20">
          Display-link: <span class="mono">${escapeHtml(displayUrl || "-")}</span><br>
          Innhenting-link: <span class="mono">${escapeHtml(collectUrl || "-")}</span>
        </div>
      `;

      const openDisplayBtn = document.getElementById("openDisplayBtn");
      const openCollectBtn = document.getElementById("openCollectBtn");
      const copyJoinCodeBtn = document.getElementById("copyJoinCodeBtn");

      if (openDisplayBtn) {
        openDisplayBtn.addEventListener("click", () => {
          if (!activeJoinCode) return;
          openInNewTab(buildUrl("display.html", { joinCode: activeJoinCode }));
          setStatus("Åpnet plenum i nytt vindu.", "ok");
        });
      }

      if (openCollectBtn) {
        openCollectBtn.addEventListener("click", () => {
          if (!activeJoinCode) return;
          openInNewTab(buildUrl("innhenting.html", { joinCode: activeJoinCode }));
          setStatus("Åpnet deltakerlenke i nytt vindu.", "ok");
        });
      }

      if (copyJoinCodeBtn) {
        copyJoinCodeBtn.addEventListener("click", async () => {
          try {
            await copyToClipboard(activeJoinCode);
            setStatus("Joincode kopiert: " + activeJoinCode, "ok");
          } catch (e) {
            const msg = e && e.message ? e.message : String(e);
            setError(msg);
            setStatus("Kunne ikke kopiere joincode.", "err");
            console.error(e);
          }
        });
      }
    }

    function renderControls() {
      if (!activeSessionId) {
        controlsBox.innerHTML = `
          <strong>Styring</strong><br>
          Start eller last en aktiv session først.
        `;
        return;
      }

      const status = lastState && lastState.status ? lastState.status : "(ukjent)";
      const roundId = lastState && lastState.roundId ? lastState.roundId : "-";
      const mode = lastState && lastState.mode ? lastState.mode : "";

      const q = lastState && lastState.question ? lastState.question : null;
      const qText = q && q.text ? String(q.text) : "";

      const multiChoices = (mode === "multi" && q && Array.isArray(q.choices))
        ? q.choices.map(c => `${c.id} | ${c.label}`).join("\n")
        : "yes | ja\nno | nei";

      controlsBox.innerHTML = `
        <strong>Styring</strong><br>
        Status: <span class="mono">${escapeHtml(status)}</span><br>
        Mode: <span class="mono">${escapeHtml(mode || "-")}</span><br>
        RoundId: <span class="mono">${escapeHtml(roundId)}</span><br><br>

        <strong>Spørsmål</strong><br>

        <div class="mt20">
          <label for="modeSel">Mode</label><br>
          <select id="modeSel" class="inputWide">
            <option value="multi" ${mode === "multi" ? "selected" : ""}>multi</option>
            <option value="likert" ${mode === "likert" ? "selected" : ""}>likert</option>
            <option value="open" ${mode === "open" ? "selected" : ""}>open</option>
            <option value="wordcloud" ${mode === "wordcloud" ? "selected" : ""}>wordcloud</option>
          </select>
        </div>

        <div class="mt20">
          <label for="qText">Spørsmålstekst (valgfri, men anbefalt)</label><br>
          <textarea id="qText" class="inputArea" rows="3" placeholder="Skriv spørsmålet her...">${escapeHtml(qText)}</textarea>
        </div>

        <div class="mt20" id="multiBox">
          <label for="multiChoices">Svaralternativer for multi</label><br>
          <div><span class="mono">Én per linje: id | label</span></div><br>
          <textarea id="multiChoices" class="inputArea" rows="6">${escapeHtml(multiChoices)}</textarea>
        </div>

        <div class="mt20 btnRow">
          <button class="btn" id="setQuestionBtn">Oppdater spørsmål</button>
          <button class="btn" id="startQuestionBtn">Start ny runde</button>
        </div>

        <div class="mt20 btnRow">
          <button class="btn" id="collectBtn">Collect</button>
          <button class="btn" id="resultsBtn">Results</button>
          <button class="btn" id="resetBtn">Reset</button>
          <button class="btn" id="endSessionBtn">End session</button>
        </div>

        <div class="mt20">
          Tips: <span class="mono">Space</span> = vis/skjul resultater, <span class="mono">N</span> = ny runde.
        </div>
      `;

      const modeSel = document.getElementById("modeSel");

      document.getElementById("setQuestionBtn").addEventListener("click", async () => {
        try {
          setError("");
          setStatus("", "info");

          const m = modeSel.value;
          const text = (document.getElementById("qText").value || "").trim();

          let question = {};
          if (text) question.text = text;

          if (m === "multi") {
            const rawChoices = document.getElementById("multiChoices").value;
            question.choices = parseChoices(rawChoices);
          }

          await App.setQuestionLease(activeSessionId, m, question);
          setStatus("Spørsmål oppdatert.", "ok");
        } catch (err) {
          const msg = (err && err.message) ? err.message : String(err);
          setError(msg);
          setStatus("Kunne ikke oppdatere spørsmål.", "err");
          console.error(err);
        }
      });

      document.getElementById("startQuestionBtn").addEventListener("click", async () => {
        try {
          setError("");
          setStatus("", "info");

          const m = modeSel.value;
          const text = (document.getElementById("qText").value || "").trim();

          let question = {};
          if (text) question.text = text;

          if (m === "multi") {
            const rawChoices = document.getElementById("multiChoices").value;
            question.choices = parseChoices(rawChoices);
          }

          const res = await App.startQuestionLease(activeSessionId, m, question);
          setStatus("Startet ny runde: " + res.roundId, "ok");
        } catch (err) {
          const msg = (err && err.message) ? err.message : String(err);
          setError(msg);
          setStatus("Start feilet.", "err");
          console.error(err);
        }
      });

      document.getElementById("collectBtn").addEventListener("click", async () => {
        try {
          setError("");
          setStatus("", "info");
          await App.setLiveStatusLease(activeSessionId, "collect");
          setStatus("Status satt til collect.", "ok");
        } catch (err) {
          const msg = (err && err.message) ? err.message : String(err);
          setError(msg);
          setStatus("Collect feilet.", "err");
          console.error(err);
        }
      });

      document.getElementById("resultsBtn").addEventListener("click", async () => {
        try {
          setError("");
          setStatus("", "info");
          await App.setLiveStatusLease(activeSessionId, "results");
          setStatus("Status satt til results.", "ok");
        } catch (err) {
          const msg = (err && err.message) ? err.message : String(err);
          setError(msg);
          setStatus("Results feilet.", "err");
          console.error(err);
        }
      });

      document.getElementById("resetBtn").addEventListener("click", async () => {
        try {
          setError("");
          setStatus("", "info");
          const res = await App.resetRoundLease(activeSessionId);
          setStatus("Ny roundId: " + res.roundId, "ok");
        } catch (err) {
          const msg = (err && err.message) ? err.message : String(err);
          setError(msg);
          setStatus("Reset feilet.", "err");
          console.error(err);
        }
      });

      document.getElementById("endSessionBtn").addEventListener("click", async () => {
        try {
          setError("");
          setStatus("", "info");

          await App.endSession(activeSessionId);

          activeSessionId = null;
          activeJoinCode = null;
          lastState = null;
          lastAgg = null;
          currentAggRoundId = null;

          if (unsubscribeState) unsubscribeState();
          if (unsubscribeAgg) unsubscribeAgg();
          unsubscribeState = null;
          unsubscribeAgg = null;

          sessionBox.innerHTML = `
            <strong>Aktiv session</strong><br>
            Session avsluttet.
          `;
          controlsBox.innerHTML = `
            <strong>Styring</strong><br>
            Ingen aktiv session akkurat nå.
          `;
          renderLease(null);
          renderPresentation();

          setStatus("Session avsluttet.", "ok");
        } catch (err) {
          const msg = (err && err.message) ? err.message : String(err);
          setError(msg);
          setStatus("End session feilet.", "err");
          console.error(err);
        }
      });
    }

    function getStatusLine(status) {
      if (status === "collect") return "Innsamling pågår";
      if (status === "results") return "Resultater vises";
      if (status === "paused") return "Pause";
      if (status === "idle") return "Klar";
      return status || "-";
    }

    function buildChoiceLabelMap(question) {
      const map = {};
      const q = question || {};
      const choices = Array.isArray(q.choices) ? q.choices : [];
      for (const c of choices) {
        if (!c) continue;
        const id = (c.id != null) ? String(c.id) : null;
        const label = (c.label != null) ? String(c.label) : (id || "");
        if (id) map[id] = label || id;
      }
      return map;
    }

    function getMultiBarClass(index, total) {
      if (total === 2) {
        return index === 0 ? "multiBar--green" : "multiBar--red";
      }

      if (total === 3) {
        if (index === 0) return "multiBar--green";
        if (index === 1) return "multiBar--yellow";
        return "multiBar--red";
      }

      const palette = [
        "multiBar--blue",
        "multiBar--green",
        "multiBar--yellow",
        "multiBar--red",
        "multiBar--purple",
        "multiBar--teal",
        "multiBar--slate"
      ];

      return palette[index % palette.length];
    }

    function renderPresentation() {
      if (!activeSessionId) {
        presentationBox.innerHTML = `
          <div class="presentationShell">
            <div class="presentationQuestion">Ingen aktiv session.</div>
            <div class="presentationPlaceholder">Start en session for å vise presentasjonsmodus her.</div>
          </div>
        `;
        clearPresentationQr();
        return;
      }

      const state = lastState;
      const agg = lastAgg;

      if (!state) {
        presentationBox.innerHTML = `
          <div class="presentationShell">
            <div class="presentationQuestion">Venter på state…</div>
            <div class="presentationPlaceholder">Presentasjonsvisningen kobler seg til aktiv session.</div>
            <div id="presentationQrDock" class="presentationQrDock hidden">
              <div class="presentationQrTitle">Scan for å delta</div>
              <div id="presentationQrBox"></div>
              <div class="presentationQrCodeText mono" id="presentationQrCodeText"></div>
              <div class="presentationQrText">Mobilen går rett til svarskjermen.</div>
            </div>
          </div>
        `;
        renderPresentationQr();
        return;
      }

      const status = state.status || null;
      const mode = state.mode || null;
      const roundId = state.roundId || null;
      const question = state.question || null;
      const questionText = question && question.text ? String(question.text).trim() : "";

      let contentHtml = "";

      if (mode !== "multi") {
        contentHtml = `
          <div class="presentationPlaceholder">
            Denne presentasjonsvisningen er foreløpig laget for <span class="mono">multi</span>.<br>
            Nåværende modus: <span class="mono">${escapeHtml(mode || "-")}</span>
          </div>
        `;
      } else if (!roundId) {
        contentHtml = `
          <div class="presentationPlaceholder">
            Venter på aktiv runde…
          </div>
        `;
      } else {
        const counts = (agg && agg.counts && typeof agg.counts === "object") ? agg.counts : {};
        const n = (agg && typeof agg.n === "number") ? agg.n : 0;
        const labelMap = buildChoiceLabelMap(question);
        const qChoices = (question && Array.isArray(question.choices)) ? question.choices : [];

        const entries = qChoices.map((c, idx) => {
          const id = (c && c.id != null) ? String(c.id) : ("choice_" + (idx + 1));
          const label = (c && (c.label || c.text)) ? String(c.label || c.text) : (labelMap[id] || id);
          const count = (typeof counts[id] === "number") ? counts[id] : 0;
          return { id, label, count };
        });

        if (!entries.length) {
          contentHtml = `
            <div class="presentationPlaceholder">
              Ingen svaralternativer å vise.
            </div>
          `;
        } else {
          const barsHtml = entries.map((entry, idx) => {
            const pct = n > 0 ? Math.round((entry.count / n) * 100) : 0;
            const heightPct = Math.max(pct, entry.count > 0 ? 4 : 0);
            const barClass = getMultiBarClass(idx, entries.length);

            return `
              <div class="multiBarWrap">
                <div class="multiBarValue">
                  ${pct} %
                  <span class="multiBarValueSub">${entry.count} svar</span>
                </div>
                <div class="multiBarTrack">
                  <div class="multiBar ${barClass}" style="height:${heightPct}%;"></div>
                </div>
                <div class="multiBarLabel">${escapeHtml(entry.label)}</div>
              </div>
            `;
          }).join("");

          contentHtml = `
            <div class="multiChart">
              ${barsHtml}
            </div>
            <div class="presentationFooter">
              Fordeling av alle innsendte svar i denne runden. Totalt: <span class="mono">${n}</span>
            </div>
          `;
        }
      }

      presentationBox.innerHTML = `
        <div class="presentationShell">
          <div class="presentationMeta">
            <span><strong>Status:</strong> ${escapeHtml(getStatusLine(status))}</span>
            <span><strong>Mode:</strong> <span class="mono">${escapeHtml(mode || "-")}</span></span>
            <span><strong>Runde:</strong> <span class="mono">${escapeHtml(roundId || "-")}</span></span>
          </div>

          <div class="presentationQuestion">
            ${questionText ? escapeHtml(questionText) : "Venter på spørsmålsformulering…"}
          </div>

          ${contentHtml}

          <div id="presentationQrDock" class="presentationQrDock hidden">
            <div class="presentationQrTitle">Scan for å delta</div>
            <div id="presentationQrBox"></div>
            <div class="presentationQrCodeText mono" id="presentationQrCodeText"></div>
            <div class="presentationQrText">Mobilen går rett til svarskjermen.</div>
          </div>
        </div>
      `;

      renderPresentationQr();
    }

    function startLeaseTicker() {
      if (leaseTicker) clearInterval(leaseTicker);
      leaseTicker = setInterval(() => {
        renderLease(lastState);
      }, 1000);
    }

    function detachAgg() {
      if (unsubscribeAgg) unsubscribeAgg();
      unsubscribeAgg = null;
      lastAgg = null;
      currentAggRoundId = null;
    }

    function attachAgg(sessionId, roundId) {
      if (unsubscribeAgg) unsubscribeAgg();

      unsubscribeAgg = App.listenAgg(
        sessionId,
        roundId,
        (agg) => {
          lastAgg = agg;
          currentAggRoundId = roundId;
          renderPresentation();
        },
        (err) => {
          setError("Kunne ikke lese agg/live: " + (err && err.message ? err.message : String(err)));
          setStatus("Kunne ikke lese agg/live.", "err");
        }
      );
    }

    function attachStateListener(sessionId) {
      if (unsubscribeState) unsubscribeState();

      unsubscribeState = App.listenLiveState(
        sessionId,
        (data) => {
          lastState = data;
          renderLease(data);
          renderControls();

          const newRoundId = data && data.roundId ? data.roundId : null;
          const mode = data && data.mode ? data.mode : null;

          if (!newRoundId || mode !== "multi") {
            detachAgg();
            renderPresentation();
            return;
          }

          if (newRoundId !== currentAggRoundId) {
            attachAgg(sessionId, newRoundId);
          } else {
            renderPresentation();
          }
        },
        (err) => {
          setError("Kunne ikke lese state/live: " + (err && err.message ? err.message : String(err)));
          setStatus("Kunne ikke lese state/live.", "err");
        }
      );

      startLeaseTicker();
    }

    async function toggleResultsShortcut() {
      if (!activeSessionId || !lastState) return;

      const current = lastState.status || "collect";
      const next = current === "results" ? "collect" : "results";

      try {
        setError("");
        await App.setLiveStatusLease(activeSessionId, next);
        setStatus(next === "results" ? "Resultater vises." : "Resultater skjules.", "ok");
      } catch (err) {
        const msg = err && err.message ? err.message : String(err);
        setError(msg);
        setStatus("Shortcut feilet.", "err");
      }
    }

    async function newRoundShortcut() {
      if (!activeSessionId) return;

      try {
        setError("");
        const res = await App.resetRoundLease(activeSessionId);
        setStatus("Ny runde startet: " + res.roundId, "ok");
      } catch (err) {
        const msg = err && err.message ? err.message : String(err);
        setError(msg);
        setStatus("Ny runde feilet.", "err");
      }
    }

    function shouldIgnoreHotkeys(target) {
      if (!target) return false;
      const tag = target.tagName ? target.tagName.toLowerCase() : "";
      return tag === "input" || tag === "textarea" || tag === "select" || target.isContentEditable;
    }

    document.addEventListener("keydown", async (ev) => {
      if (shouldIgnoreHotkeys(ev.target)) return;
      if (!activeSessionId) return;

      if (ev.code === "Space") {
        ev.preventDefault();
        await toggleResultsShortcut();
        return;
      }

      if (ev.key === "n" || ev.key === "N") {
        ev.preventDefault();
        await newRoundShortcut();
      }
    });

    loginBtn.addEventListener("click", async () => {
      try {
        setError("");
        setStatus("", "info");
        const user = await App.ensureSignedInWithGoogle();
        renderUser(user);
        setStatus("Innlogging ok.", "ok");
      } catch (err) {
        setError(err && err.message ? err.message : String(err));
        setStatus("Innlogging feilet.", "err");
        console.error(err);
      }
    });

    startSessionBtn.addEventListener("click", async () => {
      try {
        setError("");
        setStatus("", "info");
        const res = await App.startOrReplaceSession({ saveResults: true, programId: null });

        activeSessionId = res.sessionId;
        activeJoinCode = res.joinCode;
        lastState = null;
        lastAgg = null;
        currentAggRoundId = null;

        renderSessionBox();
        renderPresentation();
        attachStateListener(res.sessionId);
        setStatus("Ny session startet.", "ok");
      } catch (err) {
        const msg = (err && err.message) ? err.message : String(err);
        setError(msg);
        setStatus("Kunne ikke starte ny session.", "err");
        console.error(err);
      }
    });

    App.auth.onAuthStateChanged(async (user) => {
      renderUser(user);

      if (!user) {
        activeSessionId = null;
        activeJoinCode = null;
        lastState = null;
        lastAgg = null;
        currentAggRoundId = null;

        if (unsubscribeState) unsubscribeState();
        if (unsubscribeAgg) unsubscribeAgg();
        unsubscribeState = null;
        unsubscribeAgg = null;

        if (leaseTicker) clearInterval(leaseTicker);
        leaseTicker = null;

        leaseBox.innerHTML = `
          <strong>Controller lease</strong><br>
          Ingen aktiv session.
        `;
        sessionBox.innerHTML = `
          <strong>Aktiv session</strong><br>
          Ingen aktiv session akkurat nå.
        `;
        controlsBox.innerHTML = `
          <strong>Styring</strong><br>
          Logg inn for å starte eller laste en session.
        `;
        statusBox.innerHTML = "";
        renderPresentation();
        setError("");
        return;
      }

      try {
        setError("");
        const info = await App.getActiveSessionInfo(user.uid);

        if (info && info.activeSessionId) {
          activeSessionId = info.activeSessionId;
          activeJoinCode = info.activeJoinCode;

          renderSessionBox();
          renderPresentation();
          attachStateListener(info.activeSessionId);
          setStatus("Aktiv session lastet.", "ok");
        } else {
          activeSessionId = null;
          activeJoinCode = null;
          lastState = null;
          lastAgg = null;
          currentAggRoundId = null;

          renderSessionBox();
          leaseBox.innerHTML = `
            <strong>Controller lease</strong><br>
            Ingen aktiv session funnet på owner-peker.
          `;
          renderControls();
          renderPresentation();
          setStatus("Ingen aktiv session funnet.", "warn");
        }
      } catch (e) {
        setError(e && e.message ? e.message : String(e));
        setStatus("Kunne ikke lese owner-peker.", "err");
        console.error(e);
      }
    });

    renderPresentation();
  </script>
</body>
</html>
