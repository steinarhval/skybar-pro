<!-- innhenting.html -->
<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Innhenting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="app.css" />
</head>

<body class="innhenting-page">
  <div id="questionBox" class="mt20">
    Venter på spørsmål…
  </div>

  <div id="voteBox" class="mt20">
    Venter på aktiv runde…
  </div>

  <div id="msgBox" class="mt20" aria-live="polite"></div>

  <details id="techDetails" class="mt20">
    <summary><strong>Vis teknisk info</strong></summary>
    <div id="infoBox" class="mt20"></div>
    <div id="stateBox" class="mt20"></div>
  </details>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>

  <script>
    const questionBox = document.getElementById("questionBox");
    const infoBox = document.getElementById("infoBox");
    const stateBox = document.getElementById("stateBox");
    const voteBox = document.getElementById("voteBox");
    const msgBox = document.getElementById("msgBox");

    let unsubState = null;
    let unsubLock = null;

    let currentSessionId = null;
    let currentJoinCode = null;

    let currentRoundId = null;
    let currentMode = null;
    let currentQuestion = null;
    let currentStatus = null;

    let lockState = "none";
    let bootDone = false;
    let reconnectTimer = null;
    let lastReconnectAt = 0;
    let isSubmitting = false;

    let selectedValue = null;
    let pressedValue = null;
    let hasSeenFirstRound = false;
    let pendingNewRoundNotice = false;

    function setMsg(html) {
      msgBox.innerHTML = html || "";
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function renderInfo() {
      infoBox.innerHTML = `
        <strong>Tilkobling</strong><br>
        sessionId: <span class="mono">${escapeHtml(currentSessionId || "(mangler)")}</span><br>
        joinCode: <span class="mono">${escapeHtml(currentJoinCode || "(mangler)")}</span><br>
        clientId: <span class="mono">${escapeHtml(App.getClientId())}</span>
      `;
    }

    function safeJson(v) {
      try { return JSON.stringify(v, null, 2); } catch { return String(v); }
    }

    function renderState(state) {
      if (!state) {
        stateBox.innerHTML = `<strong>State</strong><br>Ingen state/live funnet (mangler doc eller ingen tilgang).`;
        return;
      }

      stateBox.innerHTML = `
        <strong>State (live)</strong><br>
        status: <span class="mono">${escapeHtml(state.status ?? "-")}</span><br>
        mode: <span class="mono">${escapeHtml(state.mode ?? "-")}</span><br>
        roundId: <span class="mono">${escapeHtml(state.roundId ?? "-")}</span><br>
        question: <pre class="pre">${escapeHtml(safeJson(state.question))}</pre>
      `;
    }

    function renderQuestionBox() {
      if (!currentQuestion && !currentMode) {
        questionBox.innerHTML = `Venter på spørsmål…`;
        return;
      }

      const text = currentQuestion && currentQuestion.text
        ? String(currentQuestion.text).trim()
        : "";

      questionBox.innerHTML = text
        ? `<div>${escapeHtml(text)}</div>`
        : `<span class="mono">Venter på spørsmålsformulering…</span>`;
    }

    function getMultiButtonClass(index, total) {
      if (total === 2) {
        return index === 0 ? "answerBtn--green" : "answerBtn--red";
      }

      if (total === 3) {
        if (index === 0) return "answerBtn--green";
        if (index === 1) return "answerBtn--yellow";
        return "answerBtn--red";
      }

      const palette = [
        "answerBtn--blue",
        "answerBtn--green",
        "answerBtn--yellow",
        "answerBtn--red",
        "answerBtn--purple",
        "answerBtn--teal",
        "answerBtn--slate"
      ];

      return palette[index % palette.length];
    }

    function setVoteUIWaiting() {
      voteBox.innerHTML = `Venter på aktiv runde og spørsmål…`;
    }

    function setVoteUICheckingLock() {
      voteBox.innerHTML = `<span class="mono">Sjekker om du allerede har svart…</span>`;
    }

    function renderPaused() {
      if (currentMode === "multi") {
        const q = currentQuestion || {};
        const choices = Array.isArray(q.choices) ? q.choices : null;
        if (choices && choices.length >= 2) {
          renderMulti(choices, true);
          return;
        }
      }

      voteBox.innerHTML = `
        <strong>Pause</strong><br>
        Innsamlingen er satt på pause akkurat nå.
      `;
    }

    function renderMulti(choices, isLocked = false) {
      const buttons = choices.map((c, idx) => {
        const label = (c && (c.label || c.text)) ? (c.label || c.text) : ("Valg " + (idx + 1));
        const value = (c && c.id) ? c.id : label;
        const btnClass = getMultiButtonClass(idx, choices.length);

        const isSelected = selectedValue !== null && String(selectedValue) === String(value);
        const isDimmed = isLocked && selectedValue !== null && !isSelected;
        const isPressed = pressedValue !== null && String(pressedValue) === String(value);
        const isDead = isLocked;

        const stateClasses = [
          isSelected ? "is-selected" : "",
          isDimmed ? "is-dimmed" : "",
          isPressed ? "is-pressed" : "",
          isDead ? "is-dead" : ""
        ].filter(Boolean).join(" ");

        const disabledAttr = isLocked ? "disabled" : "";

        return `
          <button
            type="button"
            class="answerBtn ${btnClass} ${stateClasses}"
            data-v="${encodeURIComponent(String(value))}"
            ${disabledAttr}>
            ${escapeHtml(label)}
          </button>
        `;
      }).join("");

      voteBox.innerHTML = `
        <strong>Velg ett svar</strong>
        <div class="answerGrid" id="choiceRow">${buttons}</div>
      `;

      if (!isLocked) {
        document.getElementById("choiceRow").addEventListener("click", (ev) => {
          const btn = ev.target.closest("button[data-v]");
          if (!btn) return;

          const v = decodeURIComponent(btn.getAttribute("data-v"));
          pressedValue = v;
          selectedValue = v;
          renderVoteUI();
          submitVote("multi", v);
        });
      }
    }

    function renderLikert() {
      const isLocked = lockState === "locked";
      const disabledAttr = isLocked ? "disabled" : "";

      voteBox.innerHTML = `
        <strong>Velg tall</strong><br>
        <div class="mt20">
          <input id="likertInput" class="input" type="number" inputmode="numeric" placeholder="0-10" ${disabledAttr} />
          <button id="likertSend" class="btn" ${disabledAttr}>Send svar</button>
        </div>
      `;

      if (!isLocked) {
        document.getElementById("likertSend").addEventListener("click", () => {
          const raw = document.getElementById("likertInput").value;
          const n = Number(raw);
          if (!Number.isFinite(n)) {
            setMsg('<strong>Mangler gyldig svar.</strong><br><span class="mono">Skriv inn et tall.</span>');
            return;
          }
          submitVote("likert", n);
        });
      }
    }

    function renderOpen() {
      const isLocked = lockState === "locked";
      const disabledAttr = isLocked ? "disabled" : "";

      voteBox.innerHTML = `
        <strong>Skriv svaret ditt</strong><br>
        <div class="mt20">
          <textarea id="openInput" class="inputArea" rows="4" placeholder="Skriv svaret ditt..." ${disabledAttr}></textarea>
          <div class="mt20">
            <button id="openSend" class="btn" ${disabledAttr}>Send svar</button>
          </div>
        </div>
      `;

      if (!isLocked) {
        document.getElementById("openSend").addEventListener("click", () => {
          const t = (document.getElementById("openInput").value || "").trim();
          if (!t) {
            setMsg('<strong>Mangler svar.</strong><br><span class="mono">Skriv noe før du sender.</span>');
            return;
          }
          submitVote("open", t);
        });
      }
    }

    function renderWordcloud() {
      const isLocked = lockState === "locked";
      const disabledAttr = isLocked ? "disabled" : "";

      voteBox.innerHTML = `
        <strong>Skriv ett ord eller en kort frase</strong><br>
        <div class="mt20">
          <input id="wcInput" class="inputWide" type="text" placeholder="Ett ord eller kort frase" ${disabledAttr} />
          <button id="wcSend" class="btn" ${disabledAttr}>Send svar</button>
        </div>
      `;

      if (!isLocked) {
        document.getElementById("wcSend").addEventListener("click", () => {
          const t = (document.getElementById("wcInput").value || "").trim();
          if (!t) {
            setMsg('<strong>Mangler svar.</strong><br><span class="mono">Skriv noe før du sender.</span>');
            return;
          }
          submitVote("wordcloud", t);
        });
      }
    }

    function renderVoteUI() {
      renderQuestionBox();

      if (currentStatus === "paused") {
        renderPaused();
        return;
      }

      if (!currentRoundId || !currentMode) {
        lockState = currentRoundId ? lockState : "none";
        setVoteUIWaiting();
        return;
      }

      if (lockState === "unknown") {
        setVoteUICheckingLock();
        return;
      }

      if (currentMode === "multi") {
        const q = currentQuestion || {};
        const choices = Array.isArray(q.choices) ? q.choices : null;
        if (!choices || choices.length < 2) {
          setVoteUIWaiting();
          return;
        }
        renderMulti(choices, lockState === "locked");
        return;
      }

      if (currentMode === "likert") { renderLikert(); return; }
      if (currentMode === "open") { renderOpen(); return; }
      if (currentMode === "wordcloud") { renderWordcloud(); return; }

      setVoteUIWaiting();
    }

    async function submitVote(mode, value) {
      if (!currentSessionId || !currentRoundId) return;
      if (lockState !== "unlocked") return;
      if (isSubmitting) return;

      isSubmitting = true;

      async function trySendOnce() {
        return App.submitVoteOnce(currentSessionId, currentRoundId, mode, value);
      }

      setMsg('<span class="mono">Sender svar…</span>');

      try {
        const res = await trySendOnce();

        lockState = "locked";
        pressedValue = null;
        renderVoteUI();

        if (!(res && res.already)) {
          setMsg('<strong>Takk.</strong><br><span class="mono">Svaret ditt er sendt.</span>');
        } else {
          setMsg('<strong>Merk.</strong><br><span class="mono">Du har allerede svart i denne runden.</span>');
        }
      } catch (e) {
        const msg = (e && e.message) ? String(e.message) : String(e);

        const looksLikeWeirdState =
          msg.includes("INTERNAL ASSERTION FAILED") ||
          msg.includes("Unexpected state") ||
          msg.includes("Unexpeced state");

        if (looksLikeWeirdState) {
          try {
            setMsg('<span class="mono">Tilkoblingen våknet litt skeivt – prøver igjen…</span>');

            if (App && App.db && typeof App.db.disableNetwork === "function") {
              try { await App.db.disableNetwork(); } catch (_) {}
            }
            if (App && App.db && typeof App.db.enableNetwork === "function") {
              try { await App.db.enableNetwork(); } catch (_) {}
            }

            await new Promise(r => setTimeout(r, 250));

            const res2 = await trySendOnce();

            lockState = "locked";
            pressedValue = null;
            renderVoteUI();

            if (!(res2 && res2.already)) {
              setMsg('<strong>Takk.</strong><br><span class="mono">Svaret ditt er sendt.</span>');
            } else {
              setMsg('<strong>Merk.</strong><br><span class="mono">Du har allerede svart i denne runden.</span>');
            }

            return;
          } catch (e2) {
            const msg2 = (e2 && e2.message) ? String(e2.message) : String(e2);
            pressedValue = null;
            setMsg('<strong>Kunne ikke sende svar.</strong><br><span class="mono">' + escapeHtml(msg2) + "</span>");
            renderVoteUI();
          }
        } else {
          pressedValue = null;
          setMsg('<strong>Kunne ikke sende svar.</strong><br><span class="mono">' + escapeHtml(msg) + "</span>");
          renderVoteUI();
        }
      } finally {
        isSubmitting = false;
      }
    }

    function attachLock(sessionId, roundId) {
      if (unsubLock) unsubLock();

      lockState = "unknown";
      renderVoteUI();

      const clientId = App.getClientId();
      unsubLock = App.listenVoteLock(
        sessionId,
        roundId,
        clientId,
        (res) => {
          const prevLockState = lockState;
          lockState = (res && res.exists) ? "locked" : "unlocked";

          if (lockState === "locked" && prevLockState !== "locked" && !isSubmitting) {
            setMsg('<strong>Merk.</strong><br><span class="mono">Du har allerede svart i denne runden.</span>');
          }

          if (lockState === "unlocked" && prevLockState !== "unlocked") {
            selectedValue = null;
            pressedValue = null;

            if (pendingNewRoundNotice) {
              setMsg('<strong>Nytt spørsmål!</strong><br><span class="mono">Du kan svare nå.</span>');
              pendingNewRoundNotice = false;
            } else {
              setMsg("");
            }
          }

          renderVoteUI();
        },
        (err) => {
          const msg = err && err.message ? err.message : String(err);
          setMsg('<strong>Kunne ikke lese vote-lock.</strong><br><span class="mono">' + escapeHtml(msg) + "</span>");
          lockState = "unknown";
          renderVoteUI();
        }
      );
    }

    function attachState(sessionId) {
      if (unsubState) unsubState();

      unsubState = App.listenLiveState(
        sessionId,
        (state) => {
          renderState(state);

          const prevRoundId = currentRoundId;

          currentStatus = state && state.status ? state.status : null;
          currentMode = state && state.mode ? state.mode : null;
          currentQuestion = state && state.question ? state.question : null;

          const newRoundId = state && state.roundId ? state.roundId : null;

          if (newRoundId !== currentRoundId) {
            currentRoundId = newRoundId;
            selectedValue = null;
            pressedValue = null;

            if (currentRoundId) {
              if (hasSeenFirstRound) {
                pendingNewRoundNotice = true;
              } else {
                hasSeenFirstRound = true;
                pendingNewRoundNotice = false;
              }

              attachLock(currentSessionId, currentRoundId);
            } else {
              if (unsubLock) unsubLock();
              unsubLock = null;
              lockState = "none";
              pendingNewRoundNotice = false;
              setMsg("");
            }
          }

          if (prevRoundId !== currentRoundId && currentRoundId) {
            renderVoteUI();
            return;
          }

          renderVoteUI();
        },
        (err) => {
          const msg = err && err.message ? err.message : String(err);
          setMsg('<strong>Kunne ikke lese state/live.</strong><br><span class="mono">' + escapeHtml(msg) + "</span>");
        }
      );
    }

    async function enableNetworkBestEffort() {
      try {
        if (App && App.db && typeof App.db.enableNetwork === "function") {
          await App.db.enableNetwork();
        }
      } catch (_) {}
    }

    function scheduleReconnect(reason) {
      if (!bootDone) return;
      if (!currentSessionId) return;
      if (document.hidden) return;
      if (isSubmitting) return;

      if (reconnectTimer) clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(async () => {
        const now = Date.now();
        if (now - lastReconnectAt < 2000) return;
        lastReconnectAt = now;

        await enableNetworkBestEffort();

        if (unsubState) { unsubState(); unsubState = null; }
        attachState(currentSessionId);

        if (currentRoundId) {
          attachLock(currentSessionId, currentRoundId);
        }
      }, 300);
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) scheduleReconnect("visibility");
    });
    window.addEventListener("focus", () => scheduleReconnect("focus"));
    window.addEventListener("online", () => scheduleReconnect("online"));

    function parseQueryJoinCode() {
      const p = new URLSearchParams(window.location.search);
      const jc = (p.get("joinCode") || "").trim().toUpperCase();
      if (/^[A-Z0-9]{6}$/.test(jc)) return jc;
      return null;
    }

    function redirectToJoin() {
      window.location.replace("join.html");
    }

    async function boot() {
      try {
        const urlJoin = parseQueryJoinCode();

        if (!urlJoin) {
          redirectToJoin();
          return;
        }

        currentJoinCode = urlJoin;

        let res;
        try {
          res = await App.resolveJoinCode(currentJoinCode);
        } catch (eResolve) {
          const m = eResolve && eResolve.message ? String(eResolve.message) : String(eResolve);
          currentSessionId = null;
          renderInfo();
          stateBox.innerHTML = "";
          renderQuestionBox();
          setVoteUIWaiting();
          setMsg(
            `<strong>Koden er ikke aktiv.</strong><br>
             Den kan være utløpt eller feil.<br><br>
             joinCode: <span class="mono">${escapeHtml(currentJoinCode)}</span><br>
             <span class="mono">${escapeHtml(m)}</span><br><br>
             Gå til <span class="mono">join.html</span> og skriv inn ny kode.`
          );
          bootDone = true;
          return;
        }

        currentSessionId = res.sessionId;

        App.setParticipantSession(currentSessionId, currentJoinCode);

        renderInfo();
        renderQuestionBox();
        attachState(currentSessionId);
        setVoteUIWaiting();
        setMsg("");

        bootDone = true;
      } catch (e) {
        const msg = e && e.message ? e.message : String(e);
        renderInfo();
        renderQuestionBox();
        setMsg('<strong>Oppstart feilet.</strong><br><span class="mono">' + escapeHtml(msg) + "</span>");
        setVoteUIWaiting();
        bootDone = true;
      }
    }

    boot();
  </script>
</body>
</html>
